<!DOCTYPE html>
<html>
<head>
    <title>Easy Calculator</title>
    <style>
        /* Centers the calculator on your screen */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }
        /* Style for the calculator box */
        .calc-box {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        /* Style for the screen */
        #screen {
            width: 100%;
            height: 50px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 15px;
            padding: 5px;
            box-sizing: border-box;
            background-color: #fff;
            border: none;
            border-radius: 5px;
        }
        /* Grid layout for buttons: 4 columns */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 60px);
            gap: 10px;
        }
        /* Style for every button */
        button {
            height: 60px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #e0e0e0;
        }
        button:hover { background-color: #d4d4d4; }
        .operator { background-color: #ff9500; color: white; }
        .operator:hover { background-color: #e08400; }
        .clear { background-color: #ff3b30; color: white; }
        .clear:hover { background-color: #d32f2f; }
    </style>
</head>
<body>

    <div class="calc-box">
        <!-- The screen where numbers appear -->
        <input type="text" id="screen" readonly>

        <!-- The grid of buttons -->
        <div class="btn-grid">
            <button class="clear" onclick="document.getElementById('screen').value = ''">C</button>
            <button class="operator" onclick="document.getElementById('screen').value += '/'">/</button>
            <button class="operator" onclick="document.getElementById('screen').value += '*'">*</button>
            <button class="operator" onclick="document.getElementById('screen').value += '-'">-</button>

            <button onclick="document.getElementById('screen').value += '7'">7</button>
            <button onclick="document.getElementById('screen').value += '8'">8</button>
            <button onclick="document.getElementById('screen').value += '9'">9</button>
            <button class="operator" onclick="document.getElementById('screen').value += '+'">+</button>

            <button onclick="document.getElementById('screen').value += '4'">4</button>
            <button onclick="document.getElementById('screen').value += '5'">5</button>
            <button onclick="document.getElementById('screen').value += '6'">6</button>
            <!-- The (=) button calculates the math expression instantly -->
            <button class="operator" onclick="document.getElementById('screen').value = eval(document.getElementById('screen').value)">=</button>

            <button onclick="document.getElementById('screen').value += '1'">1</button>
            <button onclick="document.getElementById('screen').value += '2'">2</button>
            <button onclick="document.getElementById('screen').value += '3'">3</button>
            <button onclick="document.getElementById('screen').value += '0'">0</button>
        </div>
    </div>

</body>
</html>
